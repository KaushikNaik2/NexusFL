name: Dev Integration Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  security-and-tests:
    name: Security Scan & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest bandit flake8
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Code Quality Checks (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit cleanly even if formatting style warnings exist
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Bandit SAST Security Scan
        run: |
          # Scans backend folder for hardcoded secrets, SQL injection, insecure imports
          bandit -r backend/ -ll -ii

      - name: Run PyTest Suite
        run: |
          # Execute automated unit and integration tests
          pytest backend/

  frontend-build:
    name: Next.js Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Verify Frontend Build
        working-directory: ./frontend
        run: |
          npm ci
          # Next.js comes with ESLint built-in, so we check for bad code first
          npm run lint
          # Test if the application can actually compile for production
          npm run build
