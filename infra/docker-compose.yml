services:
  fastapi-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexusfl-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://nexus_admin:nexus_secure_pass@postgres:5432/nexusfl
      - REDIS_URL=redis://redis:6379/0
      - DECISION_THRESHOLD=0.15
    volumes:
      - ../backend/global_model.pt:/app/global_model.pt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexusfl-network

  postgres:
    image: postgres:15-alpine
    container_name: nexusfl-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nexusfl
      - POSTGRES_USER=nexus_admin
      - POSTGRES_PASSWORD=nexus_secure_pass
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d nexusfl"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexusfl-network

  redis:
    image: redis:7-alpine
    container_name: nexusfl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexus_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexusfl-network

  nginx:
    image: nginx:alpine
    container_name: nexusfl-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi-backend
    networks:
      - nexusfl-network

networks:
  nexusfl-network:
    driver: bridge

volumes:
  nexus_pgdata:
  nexus_redisdata:

